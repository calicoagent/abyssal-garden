<!DOCTYPE html>

<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02122b;font-family:Georgia,serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

#ui h1{font-size:min(7vw,64px);letter-spacing:.35em;margin:0 0 8px;text-shadow:0 0 34px #2fd8ff,0 2px 18px #000;font-weight:400}
#ui p{margin:4px 0;font-size:15px;letter-spacing:.14em;opacity:.92;text-shadow:0 1px 10px #000}
#hud{position:fixed;left:14px;bottom:12px;color:#cfeeff;font:12px/1.5 system-ui,sans-serif;letter-spacing:.06em;opacity:.75;pointer-events:none;text-shadow:0 1px 6px #000;white-space:pre}
#err{position:fixed;inset:0;display:none;place-items:center;color:#ffe9e9;background:#14060a;font:16px system-ui;padding:30px;text-align:center}
</style>

<body>
<canvas id="c"></canvas>
<div id="ui"><h1>ABYSSAL GARDEN</h1><p>click to dive &mdash; WASD swim &middot; mouse look &middot; Q / E sink &amp; rise &middot; Shift surge &middot; F fly-through</p></div>
<div id="hud"></div>
<div id="err"></div>
<script>
"use strict";
/* ============ utils / RNG / noise (init-time only) ============ */
let _s=1337;function rnd(){_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function hash2(x,y){let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 return hash2(xi,yi)*(1-u)*(1-v)+hash2(xi+1,yi)*u*(1-v)+hash2(xi,yi+1)*(1-u)*v+hash2(xi+1,yi+1)*u*v}
function fbm(x,y){let a=0,f=1,amp=.5,s=0;for(let i=0;i<4;i++){s+=vnoise(x*f,y*f)*amp;a+=amp;f*=2.03;amp*=.5}return s/a}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function smooth(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}
/* terrain height — shared by mesh + placement */
function groundH(x,z){
 let h=-10+fbm(x*.018+7,z*.018+3)*7;
 const zc=Math.sin(x*.028)*16+Math.sin(x*.011)*8;
 const d=Math.abs(z-zc); h-=Math.exp(-(d*d)/(13*13))*6.5;           /* canyon channel */
 const x2=Math.cos(z*.021)*14, d2=Math.abs(x-x2); h-=Math.exp(-(d2*d2)/(11*11))*4.5;
 const r=Math.max(Math.abs(x),Math.abs(z)); h+=smooth(76,112,r)*26; /* rim walls hide the bound */
 h+=fbm(x*.09,z*.09)*1.4;
 return h;
}
/* ============ geometry builders (arrays filled once) ============ */
function MeshBuf(){this.p=[];this.n=[];this.c=[];this.b=[];this.i=[];this.v=0}
MeshBuf.prototype.quad=function(a,b,c,d,n,col,bend){const s=this.v;this.p.push(...a,...b,...c,...d);for(let k=0;k<4;k++){this.n.push(...n);this.c.push(...col);this.b.push(bend||0)}this.i.push(s,s+1,s+2,s,s+2,s+3);this.v+=4};
MeshBuf.prototype.tri=function(a,b,c,n,col,bend){const s=this.v;this.p.push(...a,...b,...c);for(let k=0;k<3;k++){this.n.push(...n);this.c.push(...col);this.b.push(bend||0)}this.i.push(s,s+1,s+2);this.v+=3};
MeshBuf.prototype.box=function(cx,cy,cz,sx,sy,sz,ry,col){const hx=sx/2,hy=sy/2,hz=sz/2,cs=Math.cos(ry||0),sn=Math.sin(ry||0);
 const R=(x,y,z)=>[cx+x*cs+z*sn,cy+y,cz-x*sn+z*cs];
 const F=[[[-hx,-hy,hz],[hx,-hy,hz],[hx,hy,hz],[-hx,hy,hz],[0,0,1]],[[hx,-hy,-hz],[-hx,-hy,-hz],[-hx,hy,-hz],[hx,hy,-hz],[0,0,-1]],
 [[hx,-hy,hz],[hx,-hy,-hz],[hx,hy,-hz],[hx,hy,hz],[1,0,0]],[[-hx,-hy,-hz],[-hx,-hy,hz],[-hx,hy,hz],[-hx,hy,-hz],[-1,0,0]],
 [[-hx,hy,hz],[hx,hy,hz],[hx,hy,-hz],[-hx,hy,-hz],[0,1,0]],[[-hx,-hy,-hz],[hx,-hy,-hz],[hx,-hy,hz],[-hx,-hy,hz],[0,-1,0]]];
 for(const f of F){const n=[f[4][0]*cs+f[4][2]*sn,f[4][1],-f[4][0]*sn+f[4][2]*cs];this.quad(R(...f[0]),R(...f[1]),R(...f[2]),R(...f[3]),n,col,0)}};
function interleave(m){const n=m.v,out=new Float32Array(n*10);for(let i=0;i<n;i++){out[i*10]=m.p[i*3];out[i*10+1]=m.p[i*3+1];out[i*10+2]=m.p[i*3+2];out[i*10+3]=m.n[i*3];out[i*10+4]=m.n[i*3+1];out[i*10+5]=m.n[i*3+2];out[i*10+6]=m.c[i*3];out[i*10+7]=m.c[i*3+1];out[i*10+8]=m.c[i*3+2];out[i*10+9]=m.b[i]}return{verts:out,idx:new Uint32Array(m.i)}}
/* ---- terrain ---- */
function buildTerrain(){const m=new MeshBuf(),N=150,S=300,st=S/N;
 for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){const x=-S/2+i*st,z=-S/2+j*st,y=groundH(x,z);
  const e=.9,nx=groundH(x-e,z)-groundH(x+e,z),nz=groundH(x,z-e)-groundH(x,z+e);let ny=2*e;const il=1/Math.hypot(nx,ny,nz);
  const sand=smooth(-13,-6,y),rocky=smooth(.35,.75,fbm(x*.05+31,z*.05+17));
  let r=lerp(.05,.36,sand),g=lerp(.10,.34,sand),b=lerp(.16,.30,sand);            /* deep rock -> sand */
  r=lerp(r,.55,rocky*.35);g=lerp(g,.16,rocky*.35);b=lerp(b,.48,rocky*.35);      /* magenta dusting */
  const mg=smooth(.55,.9,fbm(x*.11+53,z*.11+41)); r=lerp(r,.72,mg*.55);g=lerp(g,.12,mg*.55);b=lerp(b,.55,mg*.55); /* magenta ground cover tint */
  m.p.push(x,y,z);m.n.push(nx*il,ny*il,nz*il);m.c.push(r,g,b);m.b.push(0);m.v++}
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=j*(N+1)+i,b=a+1,c=a+N+1,d=c+1;m.i.push(a,c,b,b,c,d)}
 return interleave(m)}
/* ---- unit rock (icosphere-ish, subdiv 1) ---- */
function buildRockGeo(){const t=(1+Math.sqrt(5))/2;let V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
 const F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
 const mid={};function mp(a,b){const k=a<b?a*100+b:b*100+a;if(mid[k]!==undefined)return mid[k];const A=V[a],B=V[b];V.push([(A[0]+B[0])/2,(A[1]+B[1])/2,(A[2]+B[2])/2]);return mid[k]=V.length-1}
 let NF=[];for(const f of F){const ab=mp(f[0],f[1]),bc=mp(f[1],f[2]),ca=mp(f[2],f[0]);NF.push([f[0],ab,ca],[f[1],bc,ab],[f[2],ca,bc],[ab,bc,ca])}
 const m=new MeshBuf();for(let i=0;i<V.length;i++){const v=V[i],l=Math.hypot(...v),d=1+ (hash2(i*3.7,i*1.3)-.5)*.55;V[i]=[v[0]/l*d,v[1]/l*d*.78,v[2]/l*d]}
 const acc=V.map(()=>[0,0,0]);
 for(const f of NF){const A=V[f[0]],B=V[f[1]],C=V[f[2]];const ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2],vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;for(const k of f){acc[k][0]+=nx;acc[k][1]+=ny;acc[k][2]+=nz}}
 for(let i=0;i<V.length;i++){m.p.push(V[i][0],V[i][1],V[i][2]);const a=acc[i],il=1/Math.hypot(a[0],a[1],a[2]);m.n.push(a[0]*il,a[1]*il,a[2]*il);m.c.push(1,1,1);m.b.push(0);m.v++}
 for(const f of NF)m.i.push(f[0],f[1],f[2]);
 return interleave(m)}
/* ---- kelp blade strip ---- */
function buildKelpGeo(){const m=new MeshBuf(),SEG=14,W=.55;
 for(let j=0;j<=SEG;j++){const v=j/SEG,w=W*(1-v*v*.88)*(0.7+0.3*Math.sin(v*9));m.p.push(-w,v,0,w,v,0);m.n.push(0,0,1,0,0,1);m.c.push(v,0,0,v,0,0);m.b.push(v,v);m.v+=2}
 for(let j=0;j<SEG;j++){const a=j*2;m.i.push(a,a+1,a+2,a+1,a+3,a+2)}return{verts:new Float32Array(m.p.length/3*10),raw:m}}
function kelpInterleave(){const g=buildKelpGeo(),m=g.raw,n=m.v,out=new Float32Array(n*10);
 for(let i=0;i<n;i++){out[i*10]=m.p[i*3];out[i*10+1]=m.p[i*3+1];out[i*10+2]=m.p[i*3+2];out[i*10+3]=0;out[i*10+4]=0;out[i*10+5]=1;out[i*10+6]=m.c[i*3];out[i*10+7]=0;out[i*10+8]=0;out[i*10+9]=m.b[i]}return{verts:out,idx:new Uint32Array(m.i)}}
/* ---- cylinder (sponges / masts / pedestal) ---- */
function buildCylGeo(seg,open){const m=new MeshBuf();seg=seg||10;
 for(let j=0;j<=1;j++){const y=j;for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2,r=j?.72:1;m.p.push(Math.cos(a)*r,y,Math.sin(a)*r);m.n.push(Math.cos(a),0,Math.sin(a));m.c.push(1,1,1);m.b.push(0);m.v++}}
 for(let i=0;i<seg;i++){const a=i,b=i+1,c=i+seg+1,d=c+1;m.i.push(a,c,b,b,c,d)}
 if(!open){const s=m.v;m.p.push(0,1,0);m.n.push(0,1,0);m.c.push(1,1,1);m.b.push(0);m.v++;for(let i=0;i<seg;i++)m.i.push(s,i+seg+1,i+seg+2)}
 return interleave(m)}
/* ---- cone (coral tips / foliage spikes) ---- */
function buildConeGeo(){const m=new MeshBuf(),seg=7;m.p.push(0,0,0);m.n.push(0,-1,0);m.c.push(1,1,1);m.b.push(0);m.v++;
 for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2;m.p.push(Math.cos(a),0,Math.sin(a));m.n.push(Math.cos(a),.3,Math.sin(a));m.c.push(1,1,1);m.b.push(0);m.v++}
 m.p.push(0,1.6,0);m.n.push(0,1,0);m.c.push(1,1,1);m.b.push(0);m.v++;const tip=m.v-1;
 for(let i=0;i<seg;i++){m.i.push(0,1+i,2+i);m.i.push(1+i,tip,2+i)}return interleave(m)}
/* ---- fish ---- */
function buildFishGeo(){const m=new MeshBuf(),C=[.75,.85,.95];
 m.tri([0,0,1.1],[.15,0,0],[0,.20,-.5],[0,1,0],C,.15); m.tri([0,0,1.1],[0,.34,-.5],[-.15,0,0],[0,1,0],C,.15);
 m.tri([0,0,1.1],[0,-.20,-.5],[.28,0,0],[0,-1,0],C,.15); m.tri([0,0,1.1],[-.28,0,0],[0,-.34,-.5],[0,-1,0],C,.15);
 m.tri([.28,0,0],[0,0,-1.15],[0,.34,-.5],[1,0,0],C,.6); m.tri([-.28,0,0],[0,.34,-.5],[0,0,-1.15],[-1,0,0],C,.6);
 m.tri([.28,0,0],[0,-.34,-.5],[0,0,-1.15],[1,0,0],C,.6); m.tri([-.28,0,0],[0,0,-1.15],[0,-.34,-.5],[-1,0,0],C,.6);
 m.tri([0,.1,-1.1],[0,0,-1.15],[-.34,.04,-1.7],[0,1,0],[.5,.75,1],1); m.tri([0,.1,-1.1],[.34,.04,-1.7],[0,0,-1.15],[0,1,0],[.5,.75,1],1);
 m.tri([0,-.1,-1.1],[0,0,-1.15],[.34,-.04,-1.7],[0,-1,0],[.5,.75,1],1); m.tri([0,-.1,-1.1],[-.34,-.04,-1.7],[0,0,-1.15],[0,-1,0],[.5,.75,1],1);
 return interleave(m)}
/* ---- manta ---- */
function buildMantaGeo(){const m=new MeshBuf(),C=[.32,.38,.55];
 const rows=[[-.12,0,1.5],[-1.5,.06,.5],[-3.1,.25,-.6],[-1.4,.1,-1.3],[-.1,0,-1.7],[1.4,.1,-1.3],[3.1,.25,-.6],[1.5,.06,.5]];
 const ctr=[0,.16,.1];function T(a,b,c,bend){const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const il=1/(Math.hypot(nx,ny,nz)||1);m.tri(a,b,c,[nx*il,ny*il,nz*il],C,bend)}
 for(let i=0;i<7;i++){const a=rows[i],b=rows[i+1];T(ctr,a,b,Math.max(Math.abs(a[0]),Math.abs(b[0]))/3)}
 m.tri([-.08,0,-1.6],[.08,0,-1.6],[0,0,-3.4],[0,1,0],C,.25);return interleave(m)}
/* ---- quad (billboards / shafts) ---- */
function buildQuadGeo(){const m=new MeshBuf();m.quad([-1,-1,0],[1,-1,0],[1,1,0],[-1,1,0],[0,0,1],[0,0,0],0);
 const out=new Float32Array(40);for(let i=0;i<4;i++){out[i*10]=m.p[i*3];out[i*10+1]=m.p[i*3+1];out[i*10+2]=0;out[i*10+3]=0;out[i*10+4]=0;out[i*10+5]=1;out[i*10+6]=m.p[i*3];out[i*10+7]=m.p[i*3+1];out[i*10+8]=0;out[i*10+9]=0}return{verts:out,idx:new Uint32Array(m.i)}}
/* ============ instance scattering ============ */
function InstList(){this.d=[]} /* ox oy oz | sx sy sz | rotY phase spark seed | r g b  => 13 floats */
InstList.prototype.add=function(x,y,z,sx,sy,sz,rot,r,g,b,seed){this.d.push(x,y,z,sx,sy,sz,rot,rnd()*6.28,0,seed||0,r,g,b,0)};
InstList.prototype.buf=function(){return new Float32Array(this.d)};
const CLEAR=[[0,36,7],[-5,8,6],[-27,4,6],[33,-24,6],[2,-32,6],[16,-38,6],[-9,-48,9],[19,-30,11],[-27,-14,6],[32,-15,5],[7,-26,4]];
function scatterPos(minR,maxR){for(let k=0;k<60;k++){const a=rnd()*6.283,r=minR+rnd()*(maxR-minR),x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)>104||Math.abs(z)>104)continue;let bad=false;for(const c of CLEAR){const dx=x-c[0],dz=z-c[1];if(dx*dx+dz*dz<c[2]*c[2]){bad=true;break}}if(!bad)return[x,groundH(x,z),z]}return[60,groundH(60,60),60]}
const rocks=new InstList(),foliage=new InstList(),sponges=new InstList(),corals=new InstList(),cover=new InstList(),kelp=new InstList();
/* canyon wall rocks + scattered boulders */
for(let i=0;i<210;i++){const[x,y,z]=scatterPos(8,102);const s=.8+rnd()*rnd()*4.2;rocks.add(x,y-s*.25,z,s,s*(0.7+rnd()*.6),s,rnd()*6.28,.55+rnd()*.18,.53+rnd()*.16,.63+rnd()*.16)}
/* floating boulders */
for(let i=0;i<10;i++){const[x,,z]=scatterPos(18,85);const s=.6+rnd()*1.1;rocks.add(x,10+rnd()*6,z,s,s*.8,s,rnd()*6.28,.42,.44,.52)}
/* arch at (-27,-14): pillars + arc */
(function(){const ax=-27,az=-14,gb=groundH(ax,az);
 for(const sx of[-9,9]){const gy=groundH(ax+sx,az);for(let i=0;i<6;i++){rocks.add(ax+sx+(rnd()-.5)*.6,gy+i*2.55-0.4,az+(rnd()-.5)*1.0,1.55+rnd()*.35,1.85,1.55+rnd()*.35,rnd()*6.28,.60,.58,.66)}}
 for(let i=0;i<=11;i++){const a=Math.PI*i/11;rocks.add(ax+Math.cos(a)*9.2,gb+15.0+Math.sin(a)*6.0,az+(rnd()-.5)*.7,1.7+rnd()*.3,1.45,1.7+rnd()*.3,rnd()*6.28,.62,.60,.68)}})();
/* kelp forest — dense towering columns */
for(let i=0;i<880;i++){let p=scatterPos(2,100);if(p[1]>2)p=scatterPos(2,55);const inner=rnd()<.35;if(inner){const q=scatterPos(2,45);if(q[1]<=2)p=q}const hgt=Math.min((inner?13+rnd()*11:10+rnd()*10),20-p[1]);kelp.add(p[0],p[1]-.2,p[2],.8+rnd()*.7,hgt,.8,rnd()*6.28,.2,.6,.25)}
/* iridescent foliage fans (squashed spheres) + magenta ground cover */
for(let i=0;i<420;i++){let[x,y,z]=scatterPos(3,98);if(y>6){const q=scatterPos(3,60);x=q[0];y=q[1];z=q[2]}const s=.5+rnd()*1.5;foliage.add(x,y+s*.15,z,s,s*.45,s,rnd()*6.28,.62+rnd()*.3,.25+rnd()*.2,.75+rnd()*.25)}
for(let i=0;i<850;i++){let[x,y,z]=scatterPos(2,100);if(y>6){const q=scatterPos(2,60);x=q[0];y=q[1];z=q[2]}const s=.35+rnd()*.8;cover.add(x,y+.06,z,s,s*.22,s,rnd()*6.28,.78,.16+rnd()*.15,.55+rnd()*.2)}
/* barrel sponges */
for(let i=0;i<130;i++){let[x,y,z]=scatterPos(4,95);if(y>6){const q=scatterPos(4,60);x=q[0];y=q[1];z=q[2]}const s=.5+rnd()*.9;sponges.add(x,y,z,s,1+rnd()*1.6,s,rnd()*6.28,.85,.55+rnd()*.25,.18)}
/* coral cones clusters */
for(let i=0;i<520;i++){let[x,y,z]=scatterPos(3,98);if(y>6){const q=scatterPos(3,60);x=q[0];y=q[1];z=q[2]}const s=.4+rnd()*1.1;const warm=rnd();corals.add(x,y,z,s,s*(0.8+rnd()),s,rnd()*6.28,1,.35+warm*.3,.45+warm*.25)}
/* hero cluster in pose-1 view + ship encrustation */
(function(){const hx=-12,hz=-22;for(let i=0;i<8;i++){const a=rnd()*6.28,r=2.5+rnd()*4,x=hx+Math.cos(a)*r,z=hz+Math.sin(a)*r,y=groundH(x,z),s=.8+rnd()*.8;foliage.add(x,y+s*.15,z,s,s*.45,s,rnd()*6.28,.62+rnd()*.3,.25+rnd()*.2,.75+rnd()*.25)}
 for(let i=0;i<8;i++){const a=rnd()*6.28,r=2+rnd()*4.5,x=hx+Math.cos(a)*r,z=hz+Math.sin(a)*r,y=groundH(x,z),s=.5+rnd()*.9,warm=rnd();corals.add(x,y,z,s,s*(0.8+rnd()),s,rnd()*6.28,1,.35+warm*.3,.45+warm*.25)}
 for(let i=0;i<4;i++){const a=rnd()*6.28,r=3+rnd()*3.5,x=hx+Math.cos(a)*r,z=hz+Math.sin(a)*r,y=groundH(x,z),s=.6+rnd()*.7;sponges.add(x,y,z,s,1.2+rnd()*1.2,s,rnd()*6.28,.85,.55+rnd()*.25,.18)}

   depthStencilAttachment:{view:depthTex.createView(),depthLoadOp:"clear",depthClearValue:1,depthStoreOp:"discard"},timestampWrites:tsWrites});
  pass.setBindGroup(0,bg);
  const skipSet=new Set((Q.get('skip')||'').split(',').filter(x=>x!=='').map(Number));
  for(let i=0;i<10;i++){if(skipSet.has(i))continue;const d=draws[i];pass.setPipeline(d.p);pass.setVertexBuffer(0,d.v);if(d.ib)pass.setVertexBuffer(1,d.ib);pass.setIndexBuffer(d.i,"uint32");pass.drawIndexed(d.n,d.ic)}
  /* surface, shafts, bubbles, particles */
  const tr=[surfDraw,shaftDraw,bubDraw,parDraw];
  for(const d of tr){pass.setPipeline(d.p);pass.setVertexBuffer(0,d.v);if(d.ib)pass.setVertexBuffer(1,d.ib);pass.setIndexBuffer(d.i,"uint32");pass.drawIndexed(d.n,d.ic)}
  pass.end();
  let doRead=false;
  if(qs){enc.resolveQuerySet(qs,0,2,qsRes,0); if(!qsBusy&&frames%90===0){doRead=true;qsBusy=true;enc.copyBufferToBuffer(qsRes,0,qsRead,0,16)}}
  dev.queue.submit([enc.finish()]);
  if(doRead){qsRead.mapAsync(GPUMapMode.READ).then(()=>{const a=new BigUint64Array(qsRead.getMappedRange());const ms=Number(a[1]-a[0])/1e6;if(ms>0&&ms<100)gpuMs=ms;qsRead.unmap();qsBusy=false}).catch(()=>{qsBusy=false})}
  /* post pass (separate encoder) */
  const encP=dev.createCommandEncoder();
  const pp=encP.beginRenderPass({colorAttachments:[{view:capMode?postTex.createView():ctx.getCurrentTexture().createView(),loadOp:"clear",clearValue:{r:0,g:0,b:0,a:1},storeOp:"store"}]});
  pp.setBindGroup(0,postBg); pp.setPipeline(postPipe); pp.draw(3); pp.end();
  dev.queue.submit([encP.finish()]);
  if(capMode&&!capDone&&(Q.has('flycap')?flyT>+(Q.get('flycap')):frames>8)){capDone=true;
   const bpr=Math.ceil(W*4/256)*256, cbuf=dev.createBuffer({size:bpr*H,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
   const e2=dev.createCommandEncoder(); e2.copyTextureToBuffer({texture:postTex}, {buffer:cbuf,bytesPerRow:bpr,rowsPerImage:H}, [W,H]); dev.queue.submit([e2.finish()]);
   cbuf.mapAsync(GPUMapMode.READ).then(()=>{const src=new Uint8Array(cbuf.getMappedRange()), bgra=fmt.indexOf("bgra")>=0;
    const sc=1280/W, dw=1280, dh=Math.round(H*sc), cv=document.createElement("canvas"); cv.width=dw; cv.height=dh;
    const g2=cv.getContext("2d"), img=g2.createImageData(dw,dh), dst=img.data;
    for(let y=0;y<dh;y++){const sy=Math.floor(y/sc); for(let x=0;x<dw;x++){const sx=Math.floor(x/sc), si=sy*bpr+sx*4, di=(y*dw+x)*4;
     dst[di]=src[si+(bgra?2:0)]; dst[di+1]=src[si+1]; dst[di+2]=src[si+(bgra?0:2)]; dst[di+3]=255;}}
    g2.putImageData(img,0,0); const im=new Image(); im.id="capimg"; im.src=cv.toDataURL("image/png");
    im.style.cssText="position:fixed;inset:0;width:100%;height:100%"; document.body.appendChild(im);
    uiEl.style.display="none"; hud.style.display="none"; window.__CAP__=true; cbuf.unmap();}).catch(e=>{window.__CAPERR__=e.message;hud.textContent="cap fail "+e.message});}
  frames++; window.__READY__=frames>5;
  const ms=performance.now()-t0; accMs+=ms;accN++; if(ms>worst)worst=ms;
  if(now-lastHud>0.25){lastHud=now;const avg=accMs/Math.max(accN,1);accMs=0;accN=0;
   hud.textContent=(flyMode?"FLY-THROUGH "+flyT.toFixed(0)+"s ":"")+"cpu "+avg.toFixed(2)+"ms  gpu "+(gpuMs>0?gpuMs.toFixed(2)+"ms":"n/a")+"  "+W+"x"+H+(flyLog.stats?"\nFLY LOG avg "+flyLog.stats.avg+"ms p99 "+flyLog.stats.p99+"ms max "+flyLog.stats.max+"ms (cpu frame times; gpu ts avg "+(flyLog.stats.gpuMs??"n/a")+"ms)":"");
   worst=0;}
 }
 requestAnimationFrame(frame);
}
init().catch(e=>{const el=document.getElementById('err');el.style.display="grid";el.textContent="Abyssal Garden could not start: "+e.message+" — try Chrome/Edge with WebGPU enabled.";console.error(e)});
</script>
